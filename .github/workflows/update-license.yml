---
name: Update license

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 5 1 1 *"

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Update LICENSE file
        uses: FantasticFiasco/action-update-license-year@f180e962fa988db222d8f03ef4636750312d1b3d # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          assignees: ${{ github.repository_owner }}
          labels: enhancement
          prTitle: Update license copyright year to {{currentYear}}
          prBody: |
            ## Changelog

            - Update license copyright year to {{currentYear}}

            ---

            Powered by [FantasticFiasco/action-update-license-year](https://github.com/FantasticFiasco/action-update-license-year)
