name: Test YAML to JSON conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          input: tests/fixtures/sample.yaml
          from: yaml
          to: json

      - name: Assert output contains JSON fields
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q '"name"'; then
            echo "FAIL: expected '\"name\"' key in JSON output"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q '"Alice"'; then
            echo "FAIL: expected '\"Alice\"' value in JSON output"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q '"age"'; then
            echo "FAIL: expected '\"age\"' key in JSON output"
            exit 1
          fi
          echo "PASS"
