name: Test YAML to JSON conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          input: tests/fixtures/sample.yaml
          from: yaml
          to: json
      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          echo "PASS: output is non-empty"
      - name: Assert output contains expected JSON fields
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          # Check that the output contains JSON-style key-value pairs
          if ! echo "$ACTUAL" | grep -q '"name"'; then
            echo "FAIL: expected JSON key 'name' not found"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q '"Alice"'; then
            echo "FAIL: expected JSON value 'Alice' not found"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q '"age"'; then
            echo "FAIL: expected JSON key 'age' not found"
            exit 1
          fi
          echo "PASS: output contains expected JSON fields"
