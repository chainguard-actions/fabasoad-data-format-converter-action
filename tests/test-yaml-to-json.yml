name: Test YAML to JSON conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create input YAML file
        run: |
          cat > /tmp/test-input.yaml << 'EOF'
          name: Alice
          age: 30
          active: true
          EOF
      - id: action
        uses: .
        with:
          input: /tmp/test-input.yaml
          from: yaml
          to: json
      - name: Assert output is valid JSON with expected fields
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          # Check that the output contains expected JSON keys
          echo "$ACTUAL" | grep -q '"name"' || { echo "FAIL: missing 'name' key in JSON output"; exit 1; }
          echo "$ACTUAL" | grep -q '"Alice"' || { echo "FAIL: missing 'Alice' value in JSON output"; exit 1; }
          echo "$ACTUAL" | grep -q '"age"' || { echo "FAIL: missing 'age' key in JSON output"; exit 1; }
          echo "PASS"
