name: Test same format (no conversion)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create input YAML file
        run: |
          cat > /tmp/test-same.yaml << 'EOF'
          fruit: banana
          color: yellow
          EOF
      - id: action
        uses: .
        with:
          input: /tmp/test-same.yaml
          from: yaml
          to: yaml
      - name: Assert output contains original content unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          echo "$ACTUAL" | grep -q 'fruit' || { echo "FAIL: missing 'fruit' key in output"; exit 1; }
          echo "$ACTUAL" | grep -q 'banana' || { echo "FAIL: missing 'banana' value in output"; exit 1; }
          echo "$ACTUAL" | grep -q 'color' || { echo "FAIL: missing 'color' key in output"; exit 1; }
          echo "PASS"
