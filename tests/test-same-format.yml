name: Test same format (no conversion)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          input: tests/fixtures/sample.yaml
          from: yaml
          to: yaml

      - name: Assert output matches original YAML content
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "name:"; then
            echo "FAIL: expected 'name:' key in output"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "Alice"; then
            echo "FAIL: expected 'Alice' value in output"
            exit 1
          fi
          echo "PASS"
