name: Test JSON to YAML conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create input JSON file
        run: |
          cat > /tmp/test-input.json << 'EOF'
          {
            "city": "London",
            "country": "UK",
            "population": 9000000
          }
          EOF
      - id: action
        uses: .
        with:
          input: /tmp/test-input.json
          from: json
          to: yaml
      - name: Assert output is valid YAML with expected fields
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          # Check that the output contains expected YAML keys and values
          echo "$ACTUAL" | grep -q 'city' || { echo "FAIL: missing 'city' key in YAML output"; exit 1; }
          echo "$ACTUAL" | grep -q 'London' || { echo "FAIL: missing 'London' value in YAML output"; exit 1; }
          echo "$ACTUAL" | grep -q 'country' || { echo "FAIL: missing 'country' key in YAML output"; exit 1; }
          echo "PASS"
