name: Test JSON to YAML conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          input: tests/fixtures/sample.json
          from: json
          to: yaml
      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          echo "PASS: output is non-empty"
      - name: Assert output contains expected YAML fields
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          # YAML format uses "key: value" style (no quotes around keys)
          if ! echo "$ACTUAL" | grep -q 'name:'; then
            echo "FAIL: expected YAML key 'name:' not found"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q 'Bob'; then
            echo "FAIL: expected YAML value 'Bob' not found"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q 'age:'; then
            echo "FAIL: expected YAML key 'age:' not found"
            exit 1
          fi
          # YAML output should NOT contain JSON-style curly braces at the top level
          if echo "$ACTUAL" | grep -q '^{'; then
            echo "FAIL: output looks like JSON, not YAML"
            exit 1
          fi
          echo "PASS: output contains expected YAML fields"
